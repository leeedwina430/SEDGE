[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sedge-molecule"
version = "0.1.0"
description = "SEDGE S_STRUCT_CCOND property-conditioned molecular generation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.4,<3",
  "numpy>=1.26,<2",
  "rdkit==2023.9.6",
  "networkx>=3.2,<4",
  "joblib>=1.3,<2",
  "tqdm>=4.66,<5",
  "huggingface-hub>=0.22,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
sedge-prepare = "sedge_molecule.prepare:main"
sedge-train = "sedge_molecule.train:main"
sedge-requests = "sedge_molecule.requests:main"
sedge-generate = "sedge_molecule.generate:main"
sedge-evaluate = "sedge_molecule.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sedge_molecule*"]
namespaces = true

[tool.setuptools.package-data]
sedge_molecule = ["configs/*.json"]
"sedge_molecule._vendor.anymolgencritic" = ["LICENSE"]
"sedge_molecule.evaluation" = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
